<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>画中漫步</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root {
  /* one visual world: the night of June 1889. layout: full-bleed landscape canvas, HUD pinned to the safe-area corners */
  --night: #0f1a50; --ink: #17214f; --cream: #f4ecd4; --gold: #e6c256; --gold-deep: #a87d24; --vermilion: #c2452f; --mist: rgba(244, 236, 212, 0.74);
  --display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --glass: rgba(15, 26, 80, 0.66);
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--cream); font-family: var(--display); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }
#app { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
#app.rot { --sl: env(safe-area-inset-top, 0px); --st: env(safe-area-inset-right, 0px); --sr: env(safe-area-inset-bottom, 0px); --sb: env(safe-area-inset-left, 0px); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD — no blur filters here: they force the phone to re-composite the whole canvas every frame */
#hud { position: absolute; inset: 0; pointer-events: none; transition: opacity .4s; }
#hud.off { opacity: 0; }
#hud.off * { pointer-events: none !important; }
#loc { position: absolute; left: calc(16px + var(--sl)); top: calc(12px + var(--st)); display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 10px rgba(8, 12, 40, .8); }
#locN { font-size: 20px; font-weight: 900; letter-spacing: .14em; }
#locS { font-size: 11.5px; letter-spacing: .12em; color: var(--mist); }
#chips { display: flex; gap: 8px; margin-top: 7px; }
#chips span { font-size: 12px; font-weight: 600; letter-spacing: .08em; padding: 3px 10px 4px; border-radius: 12px; background: var(--glass); border: 1px solid rgba(230, 194, 86, .55); color: var(--gold); text-shadow: none; font-variant-numeric: tabular-nums; }
#fps { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(6px + var(--sb)); font: 11px/1.2 ui-monospace, Menlo, monospace; color: var(--gold); letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px #000; white-space: nowrap; }
#tools { position: absolute; right: calc(14px + var(--sr)); top: calc(10px + var(--st)); display: flex; gap: 10px; pointer-events: auto; }
.rb { width: 46px; height: 46px; border-radius: 50%; background: var(--glass); border: 1px solid rgba(230, 194, 86, .5); display: grid; place-items: center; transition: transform .12s, background .15s; }
.rb.pr, .ab.pr, .mb.pr { transform: scale(.9); background: rgba(230, 194, 86, .38); }
.rb svg { width: 22px; height: 22px; stroke: var(--cream); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#bTod .i1, #bTod .i2 { display: none; }
#bTod[data-t="0"] .i0, #bTod[data-t="1"] .i1, #bTod[data-t="2"] .i2 { display: block; }
#bTod[data-t="1"] .i0, #bTod[data-t="2"] .i0 { display: none; }
#menu { position: absolute; right: calc(14px + var(--sr)); top: calc(64px + var(--st)); width: 212px; background: rgba(244, 236, 212, .97); color: var(--ink); border-radius: 12px; box-shadow: 0 0 0 1px var(--gold-deep), 0 14px 34px rgba(8, 12, 40, .45); overflow: hidden; pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity .2s, transform .2s; }
#menu.on { opacity: 1; transform: none; pointer-events: auto; }
#menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 16px; text-align: left; border-bottom: 1px solid rgba(23, 33, 79, .12); color: var(--ink); }
#menu button:last-child { border-bottom: 0; }
#menu button.pr { background: rgba(230, 194, 86, .4); }
#menu svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; pointer-events: none; }
#menu span { font-size: 15.5px; font-weight: 600; letter-spacing: .1em; }
#menu small { display: block; font-size: 11px; opacity: .65; letter-spacing: .04em; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
#modes { position: absolute; right: calc(18px + var(--sr)); bottom: calc(22px + var(--sb)); display: flex; gap: 14px; pointer-events: auto; }
.mb { width: 62px; height: 62px; border-radius: 50%; background: var(--glass); border: 1.5px solid rgba(244, 236, 212, .5); display: grid; place-items: center; transition: transform .12s, background .15s; }
.mb span { font-size: 19px; font-weight: 900; pointer-events: none; }
.mb.on { background: var(--gold); border-color: #fff3c4; color: #2a1e06; box-shadow: 0 0 0 5px rgba(230, 194, 86, .25); }
#acts { position: absolute; right: calc(18px + var(--sr)); bottom: calc(98px + var(--sb)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto; }
.ab { min-height: 50px; padding: 0 22px 0 16px; border-radius: 26px; background: var(--glass); border: 1px solid rgba(230, 194, 86, .75); display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; letter-spacing: .1em; box-shadow: 0 6px 22px rgba(8, 12, 40, .35); animation: pop .25s ease-out; transition: transform .12s, background .15s; }
.ab i { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(230, 194, 86, .25); pointer-events: none; }
.ab span { pointer-events: none; }
#a2 i { background: var(--vermilion); box-shadow: 0 0 0 4px rgba(194, 69, 47, .3); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#rest { position: absolute; left: calc(46px + var(--sl)); bottom: calc(40px + var(--sb)); width: 108px; height: 108px; border-radius: 50%; border: 1px dashed rgba(244, 236, 212, .3); display: grid; place-items: center; }
#rest::after { content: ""; width: 40px; height: 40px; border-radius: 50%; background: rgba(244, 236, 212, .16); }
#stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 1px solid rgba(244, 236, 212, .4); background: rgba(15, 26, 80, .25); opacity: 0; transition: opacity .15s; }
#stick.on { opacity: 1; }
#stick.on ~ #rest, #hud.off #rest { opacity: 0; }
#nub { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(244, 236, 212, .85); box-shadow: 0 0 0 5px rgba(230, 194, 86, .3); transform: translate(-50%, -50%); }
#toast { position: absolute; left: 50%; top: calc(12px + var(--st)); transform: translate(-50%, -12px); width: max-content; max-width: 46%; padding: 10px 20px 11px; text-align: center; background: rgba(244, 236, 212, .96); color: var(--ink); border-radius: 3px; box-shadow: 0 0 0 1px var(--gold-deep), 0 0 0 5px rgba(244, 236, 212, .28), 0 14px 34px rgba(8, 12, 40, .4); opacity: 0; transition: opacity .4s, transform .4s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toastTag { font-size: 11px; letter-spacing: .34em; color: var(--vermilion); margin-bottom: 3px; }
#toastT { font-size: 17px; font-weight: 900; letter-spacing: .08em; text-wrap: balance; }
#toastS { font-size: 12.5px; letter-spacing: .05em; margin-top: 3px; opacity: .8; line-height: 1.55; text-wrap: balance; }

#rec { position: absolute; left: 50%; top: calc(10px + var(--st)); transform: translateX(-50%); display: none; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 18px; background: rgba(8, 12, 40, .55); font-size: 13px; letter-spacing: .08em; font-variant-numeric: tabular-nums; z-index: 4; }
#rec.on { display: flex; }
#rec i { width: 10px; height: 10px; border-radius: 50%; background: #e2412f; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: fl .45s ease-out; }
@keyframes fl { 0% { opacity: .75; } 100% { opacity: 0; } }
#caption { position: absolute; left: calc(22px + var(--sl)); bottom: calc(26px + var(--sb)); pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .8s .5s, transform .8s .5s; text-shadow: 0 1px 12px rgba(8, 12, 40, .85); }
#caption.on { opacity: 1; transform: none; }
#capT { font-size: 24px; font-weight: 900; letter-spacing: .08em; margin-left: -.5em; }
#capS { font-size: 13px; letter-spacing: .14em; margin-top: 6px; color: var(--mist); }
#capH { font-size: 11px; letter-spacing: .2em; margin-top: 12px; color: var(--gold); }

/* panels */
.scrim { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 12, 40, 0); pointer-events: none; transition: background .3s; z-index: 5; }
.scrim.on { background: rgba(8, 12, 40, .5); pointer-events: auto; }
.sheet { width: min(100%, 600px); max-height: 94%; overflow: hidden auto; scrollbar-width: none; touch-action: none; background: var(--cream); color: var(--ink); border-radius: 18px 18px 0 0; padding: 20px 22px calc(22px + var(--sb)); transform: translateY(104%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 -1px 0 var(--gold-deep), 0 -10px 40px rgba(8, 12, 40, .4); }
.sheet::-webkit-scrollbar { display: none; }
.scrim.on .sheet { transform: none; }
.sheet h2 { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: .1em; text-wrap: balance; }
.sheet .sub { font-size: 12.5px; letter-spacing: .1em; color: var(--vermilion); margin-top: 6px; }
.sheet p { font-size: 14.5px; line-height: 1.8; margin: 12px 0 0; text-align: justify; }
.row { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; min-height: 50px; border-radius: 26px; border: 1px solid var(--ink); font-size: 15px; font-weight: 600; letter-spacing: .12em; color: var(--ink); transition: transform .1s, background .12s; }
.btn.pri { background: var(--ink); color: var(--cream); }
.btn.pr { transform: scale(.96); background: var(--gold); color: #2a1e06; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.x { font-size: 14px; letter-spacing: .14em; color: var(--ink); min-width: 64px; min-height: 44px; text-align: right; }
.x.pr { color: var(--vermilion); }
.sheet h3 { font-size: 12px; letter-spacing: .3em; color: var(--vermilion); margin: 18px 0 9px; font-weight: 600; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.seg { display: flex; border: 1px solid var(--ink); border-radius: 26px; overflow: hidden; }
.seg button { flex: 1; min-height: 50px; font-size: 14.5px; letter-spacing: .06em; color: var(--ink); border-right: 1px solid rgba(23, 33, 79, .25); transition: background .12s; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--cream); }
.seg button.pr { background: var(--gold); color: #2a1e06; }
.togs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tog { min-height: 50px; border-radius: 26px; border: 1px solid var(--ink); font-size: 14.5px; letter-spacing: .06em; color: var(--ink); transition: background .12s; }
.tog.on { background: var(--ink); color: var(--cream); }
.tog.pr { background: var(--gold); color: #2a1e06; }
#sGo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.go { text-align: left; min-height: 56px; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(23, 33, 79, .35); display: flex; flex-direction: column; justify-content: center; gap: 3px; color: var(--ink); transition: background .12s; }
.go b { font-size: 14.5px; letter-spacing: .06em; pointer-events: none; } .go span { font-size: 10.5px; opacity: .7; pointer-events: none; }
.go.here { border-color: var(--vermilion); box-shadow: inset 0 0 0 1px var(--vermilion); }
.go.pr { background: var(--gold); }
#sDismiss { margin-top: 16px; width: 100%; }
.grow { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 14px; margin-top: 12px; }
.grow label { font-size: 15px; font-weight: 600; letter-spacing: .1em; }
.inl { display: flex; align-items: center; gap: 14px; } .inl .tog { min-width: 110px; } .inl span { font-size: 12px; opacity: .6; }
.togs.two { grid-template-columns: 1fr 1.6fr; } .tog.lab { display: grid; place-items: center; cursor: pointer; }
.sp { flex: 1; }
#app.big .grow { grid-template-columns: 130px 1fr; margin-top: 16px; } #app.big .grow label { font-size: 18px; }
.note { font-size: 12px !important; opacity: .65; line-height: 1.7 !important; text-align: left !important; margin-top: 8px !important; }
.art { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(23, 33, 79, .14); }
.art.pr { background: rgba(230, 194, 86, .25); }
.art i { flex: 0 0 46px; height: 58px; display: flex; flex-direction: column; border: 3px solid var(--gold-deep); box-shadow: 0 2px 6px rgba(23, 33, 79, .3); pointer-events: none; }
.art i s { flex: 1; }
.art div { pointer-events: none; }
.art b { display: block; font-size: 16px; letter-spacing: .06em; } .art span { font-size: 12px; opacity: .72; letter-spacing: .06em; }
.art em { font-style: normal; font-size: 11px; margin-left: 8px; padding: 1px 7px 2px; border: 1px solid var(--vermilion); color: var(--vermilion); border-radius: 3px; letter-spacing: .08em; }
.art p { font-size: 13.5px; line-height: 1.8; margin: 6px 0 0; }
.art.un { opacity: .55; }
#bookN { font-size: 13px; color: var(--vermilion); letter-spacing: .1em; font-variant-numeric: tabular-nums; }

/* originals, photos, films */
#viewer { position: absolute; inset: 0; background: rgba(8, 10, 30, .94); display: flex; align-items: center; justify-content: center; gap: 22px; padding: calc(14px + var(--st)) calc(20px + var(--sr)) calc(14px + var(--sb)) calc(20px + var(--sl)); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 7; }
#viewer.on { opacity: 1; pointer-events: auto; }
#viewer .pic { flex: 1 1 auto; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
#vImg, #vVid { max-width: 100%; max-height: 100%; border: 10px solid #c99a34; border-image: linear-gradient(135deg, #f3d77a, #a87d24 30%, #f0cf66 52%, #8a6219 76%, #e6c256) 1; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; touch-action: auto; }
#viewer .side { flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px; }
#vT { font-size: 20px; font-weight: 900; letter-spacing: .08em; text-wrap: balance; }
#vS { font-size: 12.5px; letter-spacing: .08em; color: var(--mist); line-height: 1.7; }
#vMsg { font-size: 12.5px; color: var(--gold); line-height: 1.7; }
#vLink { font-size: 13px; color: var(--gold); letter-spacing: .08em; padding: 8px 0; }
#vCred { font-size: 10.5px; opacity: .5; letter-spacing: .04em; }
#vClose { margin-top: 10px; min-height: 48px; border-radius: 24px; border: 1px solid var(--cream); font-size: 15px; letter-spacing: .2em; }
#vClose.pr { background: var(--gold); color: #2a1e06; }

/* tablets: the same layout with larger hands in mind */
#app.big #locN { font-size: 27px; } #app.big #locS { font-size: 14px; } #app.big #chips span { font-size: 15px; padding: 4px 13px 5px; }
#app.big .rb { width: 60px; height: 60px; } #app.big .rb svg { width: 28px; height: 28px; } #app.big #tools { gap: 14px; right: calc(22px + var(--sr)); top: calc(18px + var(--st)); }
#app.big #loc { left: calc(24px + var(--sl)); top: calc(20px + var(--st)); }
#app.big #menu { top: calc(90px + var(--st)); right: calc(22px + var(--sr)); width: 260px; } #app.big #menu button { min-height: 66px; } #app.big #menu span { font-size: 19px; } #app.big #menu small { font-size: 13px; max-width: 180px; }
#app.big .mb { width: 84px; height: 84px; } #app.big .mb span { font-size: 26px; } #app.big #modes { right: calc(34px + var(--sr)); bottom: calc(40px + var(--sb)); gap: 20px; }
#app.big #acts { right: calc(34px + var(--sr)); bottom: calc(146px + var(--sb)); } #app.big .ab { min-height: 62px; font-size: 19px; padding: 0 28px 0 20px; border-radius: 32px; }
#app.big #rest { left: calc(80px + var(--sl)); bottom: calc(80px + var(--sb)); width: 148px; height: 148px; } #app.big #stick { width: 164px; height: 164px; margin: -82px 0 0 -82px; } #app.big #nub { width: 70px; height: 70px; }
#app.big #toast { padding: 14px 28px 15px; } #app.big #toastT { font-size: 22px; } #app.big #toastS { font-size: 15px; } #app.big #toastTag { font-size: 13px; }
#app.big .sheet { width: min(100%, 860px); padding: 28px 32px calc(30px + var(--sb)); } #app.big .sheet h2 { font-size: 26px; } #app.big .sheet p { font-size: 17px; } #app.big .sheet h3 { font-size: 14px; margin: 24px 0 12px; }
#app.big .seg button, #app.big .tog, #app.big .btn { min-height: 60px; font-size: 17px; } #app.big .go { min-height: 70px; } #app.big .go b { font-size: 17px; } #app.big .go span { font-size: 12.5px; }
#app.big .art b { font-size: 19px; } #app.big .art p { font-size: 15.5px; } #app.big .art i { flex-basis: 60px; height: 76px; }
#app.big #title h1 { font-size: 84px; } #app.big #title .tl { font-size: 20px; } #app.big #start { min-height: 68px; font-size: 22px; padding: 0 52px; border-radius: 36px; } #app.big #title { padding: 0 60px 60px; }
#app.big #capT { font-size: 34px; } #app.big #capS { font-size: 17px; } #app.big #fadeT { font-size: 48px; } #app.big #fadeS { font-size: 18px; }
#app.big #viewer .side { flex-basis: 280px; } #app.big #vT { font-size: 27px; } #app.big #vS, #app.big #vMsg { font-size: 15.5px; } #app.big #vClose { min-height: 60px; font-size: 18px; }
#app.big #rec { font-size: 16px; padding: 9px 18px 9px 14px; }

/* title and passage between paintings */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 calc(30px + var(--sr)) calc(30px + var(--sb)) calc(30px + var(--sl)); background: linear-gradient(180deg, rgba(8, 12, 40, 0) 30%, rgba(8, 12, 40, .8) 100%); transition: opacity .9s; z-index: 6; }
#title.gone { opacity: 0; pointer-events: none; }
#title h1 { margin: 0; font-size: 54px; font-weight: 900; letter-spacing: .12em; line-height: 1.1; text-shadow: 0 2px 30px rgba(8, 12, 40, .7); }
#title .tl { margin-top: 12px; font-size: 15px; letter-spacing: .18em; color: var(--mist); max-width: 30em; line-height: 1.8; }
#start { margin-top: 22px; align-self: flex-start; min-height: 54px; padding: 0 38px; border-radius: 28px; background: var(--gold); color: #2a1e06; font-size: 17px; font-weight: 900; letter-spacing: .3em; box-shadow: 0 8px 30px rgba(230, 194, 86, .35); }
#start.pr { transform: scale(.95); }
#fade { position: absolute; inset: 0; background: var(--cream); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 30px; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 8; }
#fade.on { opacity: 1; pointer-events: auto; }
#fadeT { font-size: 34px; font-weight: 900; letter-spacing: .2em; margin-right: -.2em; }
#fadeS { font-size: 14px; letter-spacing: .14em; color: var(--vermilion); text-wrap: balance; line-height: 1.7; order: 2; }
#fade::before { content: ""; width: 46px; height: 1px; background: var(--gold-deep); order: 1; }
#err { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; background: var(--night); z-index: 9; line-height: 1.8; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; animation-duration: .01s !important; } }
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="hud" class="off">
  <div id="loc"><span id="locN">梵高小镇</span><span id="locS"></span><div id="chips"><span id="chStar" hidden></span><span id="chMail" hidden></span></div></div>
  <div id="fps" hidden></div>
  <div id="tools">
    <button class="rb" id="bTod" data-t="2" aria-label="切换白天、黄昏、夜晚">

    const r = l.r, i0 = Math.floor((l.x - r) / cell), i1 = Math.floor((l.x + r) / cell), j0 = Math.floor((l.z - r) / cell), j1 = Math.floor((l.z + r) / cell);

    for (const b of ctx.occB) put(b.x, b.z, Math.hypot(b.hw, b.hd), b);

    const x = P[v * 3], y = P[v * 3 + 1], z = P[v * 3 + 2], nx = N[v * 4] / 127, ny = N[v * 4 + 1] / 127, nz = N[v * 4 + 2] / 127;
    const a = grid.get(key(Math.floor(x / cell), Math.floor(z / cell)));
    if (a) {
      let r = 0, g = 0, b = 0;
      for (let i = 0; i < a.length; i++) {

        for (let i = 0; i < o.length; i++) {
          const q = o[i];
          if (q.hw !== undefined) { if (sy > q.h) continue; const ex = sx - q.x, ez = sz - q.z, lx = ex * q.c - ez * q.s, lz = ex * q.s + ez * q.c; if (Math.abs(lx) < q.hw && Math.abs(lz) < q.hd) { sh = 1; break; } }

        }

}

/* taps fire on finger-up without waiting for a click, and survive a few pixels of wobble */
function tap(el, fn) {
  let sx = 0, sy = 0, st = 0, id = null;
  el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); id = e.pointerId; el.classList.add('pr'); });
  el.addEventListener('pointerup', e => { el.classList.remove('pr'); if (e.pointerId === id && Math.hypot(e.clientX - sx, e.clientY - sy) < 16 && performance.now() - st < 900) { e.preventDefault(); fn(e); } id = null; });
  el.addEventListener('pointercancel', () => { el.classList.remove('pr'); id = null; });
  el.addEventListener('pointerleave', () => el.classList.remove('pr'));
  el.addEventListener('click', e => { if (e.detail === 0) fn(e); });
}
/* panels scroll by dragging anywhere on them, in whichever way the stage is turned */
function dragScroll(el) {
  let y0 = 0, s0 = 0, id = null, v = 0, ly = 0, lt = 0, raf = 0;
  el.addEventListener('pointerdown', e => { id = e.pointerId; y0 = ly = PY(e); s0 = el.scrollTop; v = 0; lt = performance.now(); cancelAnimationFrame(raf); });
  el.addEventListener('pointermove', e => { if (e.pointerId !== id) return; const y = PY(e), now = performance.now(); if (Math.abs(y - y0) > 5) el.scrollTop = s0 - (y - y0); if (now > lt) v = (ly - y) / (now - lt) * 16; ly = y; lt = now; });
  const end = e => { if (e.pointerId !== id) return; id = null; const glide = () => { if (Math.abs(v) < 0.4) return; el.scrollTop += v; v *= 0.94; raf = requestAnimationFrame(glide); }; glide(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { el.scrollTop += e.deltaY; }, { passive: true });
}

/* ---------- frame ---------- */
function env() {

}

      for (; n < 8; n++) { let bi = -1, bd = 1e9; for (let i = 0; i < L.length; i++) if (G.rfd[i] < bd) { bd = G.rfd[i]; bi = i; } if (bi < 0) break; G.rfd[bi] = 2e9; const f = L[bi].refl; rf[n * 4] = f[0]; rf[n * 4 + 1] = f[1]; rf[n * 4 + 2] = f[2]; rf[n * 4 + 3] = f[3]; }

}

/* always landscape: if the phone is held upright the whole stage is turned on its side */
function layout() {
  const pw = window.innerWidth, ph = window.innerHeight, app = $('app'), rot = ph > pw;
  G.rot = rot; G.LW = rot ? ph : pw; G.LH = rot ? pw : ph;
  app.style.width = G.LW + 'px'; app.style.height = G.LH + 'px'; app.style.transform = rot ? 'rotate(90deg) translateY(-100%)' : 'none'; app.classList.toggle('rot', rot);
}
const PX = e => G.rot ? e.clientY : e.clientX, PY = e => G.rot ? window.innerWidth - e.clientX : e.clientY;
function resize() {

  const eff = Math.max(Math.min(dpr, 1), Math.min(dpr, Math.sqrt(budget / pts)));

  const Q = QP[G.set.preset]; G.R.skyScale = Math.min(0.85, Math.sqrt(Q.sky / (G.R.w * G.R.h))); G.R.skyEvery = Q.se; G.R.q2 = Q.s2; G.R.skyDirty = true; G.envTod = -1;
  G.big = G.LH > 700; $('app').classList.toggle('big', G.big);
}

/* ---------- photo and film ---------- */
function composePhoto(spot, score) {
  const cv = $('c'), w = cv.width, h = cv.height, o = document.createElement('canvas'); o.width = w; o.height = h;
  const x = o.getContext('2d'); x.drawImage(cv, 0, 0);
  const b = Math.round(h * 0.03), g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#f3d77a'); g.addColorStop(0.3, '#a87d24'); g.addColorStop(0.52, '#f0cf66'); g.addColorStop(0.76, '#8a6219'); g.addColorStop(1, '#e6c256');
  x.strokeStyle = g; x.lineWidth = b; x.strokeRect(b / 2, b / 2, w - b, h - b); x.strokeStyle = '#6a4a12'; x.lineWidth = Math.max(1, b * 0.1); x.strokeRect(b, b, w - 2 * b, h - 2 * b);
  const t1 = spot ? '《' + ART[spot.art].t + '》里的我' : WORLD_INFO[G.wid].n, t2 = ['白天', '黄昏', '夜晚'][Math.round(G.tod) % 3] + ' · 画中漫步' + (score !== null && score !== undefined ? ' · 还原度 ' + score + '%' : '');
  const f1 = Math.round(h * 0.036), f2 = Math.round(h * 0.022); x.font = '900 ' + f1 + 'px "Noto Serif SC","Songti SC",serif';
  const tw = Math.max(x.measureText(t1).width, f2 * t2.length * 0.95) + f1 * 2, ph = f1 + f2 + f1 * 0.9, px = (w - tw) / 2, py = h - b * 1.6 - ph;
  const pg = x.createLinearGradient(0, py, 0, py + ph); pg.addColorStop(0, '#f3d77a'); pg.addColorStop(1, '#c99a34'); x.fillStyle = pg; x.fillRect(px, py, tw, ph); x.strokeStyle = '#6a4a12'; x.lineWidth = Math.max(1, b * 0.08); x.strokeRect(px, py, tw, ph);
  x.fillStyle = '#3a2a0a'; x.textAlign = 'center'; x.textBaseline = 'top'; x.fillText(t1, w / 2, py + f1 * 0.3); x.font = '600 ' + f2 + 'px "Noto Serif SC","Songti SC",serif'; x.fillText(t2, w / 2, py + f1 * 1.45);

}
function takePhoto() {
  if (G.mode !== 'play') return;
  const spot = spotHere(), score = Play.score(spot);
  UI.hud(false); UI.flash();
  setTimeout(() => {
    G.cap = () => {
      let url = null; try { url = composePhoto(spot, score); } catch (e) { }
      UI.hud(true);
      if (score !== null && spot) { const best = G.scores[spot.art] || 0; if (score > best) { G.scores[spot.art] = score; store.set('scores', G.scores); } }
      const tail = score !== null ? (score >= 80 ? ' · 还原度 ' + score + '%，几乎就是那幅画' : ' · 还原度 ' + score + '%') : '';
      if (!url) { UI.toast('没有拍下来', '请再试一次', 2400); return; }
      if (Native.on && Native.post('photo', { data: url }, (ok, msg) => UI.toast(ok ? '已存入相册' : '没有存下来', ok ? ('照片' + tail) : msg, 3200))) return;

}
function toggleRecord() {

    else { try { r.mr.stop(); } catch (e) { } }
    return;
  }

    mr.start(500); G.rec = { mr, t0: G.time }; UI.recording(true);

}

/* ---------- input ---------- */
function bindInput() {

    } else if (I.looks.has(e.pointerId)) {

      if (I.looks.size >= 2) { let o = null; I.looks.forEach((v, k2) => { if (k2 !== e.pointerId) o = v; }); const d0 = Math.hypot(q.x - o.x, q.y - o.y), d1 = Math.hypot(x - o.x, y - o.y); G.cam.dist = clamp(G.cam.dist * (d0 / Math.max(1, d1)), 2.2, 12); }

  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  window.addEventListener('keydown', e => { I.keys[e.code] = true; if (e.code === 'KeyE' || e.code === 'Enter') UI.primary(); if (e.code === 'KeyB') setRide(!G.riding); if (e.code === 'KeyR') { G.run = !G.run; UI.modes(); } if (e.code === 'Escape') { leaveView(); UI.closeAll(); } });

  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 250));
}

  try { G.R = new Renderer(cv, G.set.aa); } catch (e) { $('err').textContent = '这个浏览器不支持 WebGL2，无法打开画布。' + (e && e.message ? '（' + String(e.message).slice(0, 120) + '）' : ''); $('err').hidden = false; return; }
