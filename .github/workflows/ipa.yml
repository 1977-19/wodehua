name: Build IPA and APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'ios/**', 'android/**', '.github/workflows/ipa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        run: |
          set -euo pipefail
          APP=build/Payload/HuaZhong.app
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          { xcodebuild -version; echo "SDK $SDK"; } > "$RUNNER_TEMP/build.log" 2>&1
          xcrun --sdk iphoneos swiftc -O -parse-as-library -target arm64-apple-ios15.0 -sdk "$SDK" ios/App/*.swift -o "$APP/HuaZhong" >> "$RUNNER_TEMP/build.log" 2>&1
          cp ios/Info.plist "$APP/Info.plist"
          cp index.html "$APP/index.html"
          cp ios/icons/*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          codesign --force --sign - "$APP" >> "$RUNNER_TEMP/build.log" 2>&1 || true
          (cd build && zip -qry HuaZhongManBu.ipa Payload)
          ls -l build/HuaZhongManBu.ipa >> "$RUNNER_TEMP/build.log"
          echo "OK $GITHUB_SHA" >> "$RUNNER_TEMP/build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: HuaZhongManBu-ipa
          path: build/HuaZhongManBu.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          sleep 3
          gh release create latest build/HuaZhongManBu.ipa --target "$GITHUB_SHA" --title "画中漫步 IPA" --notes "iPhone / iPad：HuaZhongManBu.ipa（未签名，用 AltStore、Sideloadly 或 TrollStore 安装）。安卓：HuaZhongManBu.apk（直接安装）。"
          echo "RELEASED" >> "$RUNNER_TEMP/build.log"
      - name: Keep the build log
        if: always()
        run: |
          set -e
          cp "$RUNNER_TEMP/build.log" /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          echo "sha $GITHUB_SHA  status ${{ job.status }}" >> /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-log
          git rm -rfq . || true
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -qm "build log"
          git push -f origin ci-log
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and package APK
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/apk.log"; : > "$LOG"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | grep -v -i rc | sort -V | tail -1)
          P="$ANDROID_HOME/platforms/android-34"; [ -d "$P" ] || P=$(ls -d "$ANDROID_HOME"/platforms/android-[0-9]* | sort -V | tail -1)
          PLAT="$P/android.jar"
          echo "build-tools $BT  platform $P" >> "$LOG"
          mkdir -p out/classes out/assets
          cp index.html out/assets/
          javac -source 11 -target 11 -cp "$PLAT" -d out/classes android/src/com/huazhong/manbu/MainActivity.java >> "$LOG" 2>&1
          "$BT/d8" --lib "$PLAT" --min-api 29 --output out $(find out/classes -name '*.class') >> "$LOG" 2>&1
          "$BT/aapt2" compile --dir android/res -o out/res.zip >> "$LOG" 2>&1
          "$BT/aapt2" link -o out/u.apk -I "$PLAT" --manifest android/AndroidManifest.xml -A out/assets --min-sdk-version 29 --target-sdk-version 29 out/res.zip >> "$LOG" 2>&1
          (cd out && zip -q u.apk classes.dex)
          "$BT/zipalign" -f 4 out/u.apk out/a.apk >> "$LOG" 2>&1
          "$BT/apksigner" sign --ks android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias huazhong --out out/HuaZhongManBu.apk out/a.apk >> "$LOG" 2>&1
          "$BT/apksigner" verify out/HuaZhongManBu.apk >> "$LOG" 2>&1
          ls -l out/HuaZhongManBu.apk >> "$LOG"
          echo "APK OK $GITHUB_SHA" >> "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: HuaZhongManBu-apk
          path: out/HuaZhongManBu.apk
      - name: Add to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest out/HuaZhongManBu.apk --clobber
          echo "APK RELEASED" >> "$RUNNER_TEMP/apk.log"
      - name: Keep the build log
        if: always()
        run: |
          set -e
          cp "$RUNNER_TEMP/apk.log" /tmp/apk.log 2>/dev/null || echo "no log" > /tmp/apk.log
          echo "sha $GITHUB_SHA  status ${{ job.status }}" >> /tmp/apk.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch -q origin ci-log
          git checkout -q -f FETCH_HEAD
          cp /tmp/apk.log apk.log
          git add -f apk.log
          git commit -qm "apk log"
          git push -f origin HEAD:ci-log
